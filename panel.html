<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Work Log</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-mode="panel">
<header class="top"><div class="brand"><i class="fa-solid fa-book-open"></i> Daily Work Log</div><div class="sp"></div><button class="sync" id="sync" type="button"></button><div class="clock" data-clock></div></header>
<div id="banner"></div>
<main>
  <section id="work"></section>
  <aside class="pane">
    <div class="ph"><span><i class="fa-solid fa-clock-rotate-left"></i> Previous work</span></div>
    <div class="sbar"><i class="fa-solid fa-magnifying-glass"></i><input id="hq" class="in" placeholder="Search earlier work, notes, websites" autocomplete="off"></div>
    <div class="list" id="hist"></div>
  </aside>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
